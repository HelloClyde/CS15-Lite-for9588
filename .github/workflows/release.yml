name: Tagged Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      CS15_SOURCE_RELEASE: v0.1.1
      CS15_SOURCE_ARCHIVE: CS15-original-cstrike-assets.zip

    steps:
      - name: Checkout source and SDK submodule
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download authorized original assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $downloadRoot = 'build/source-release'
          New-Item -ItemType Directory -Force -Path $downloadRoot | Out-Null
          gh release download $env:CS15_SOURCE_RELEASE `
            --repo $env:GITHUB_REPOSITORY `
            --pattern "$($env:CS15_SOURCE_ARCHIVE)*" `
            --dir $downloadRoot
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to download original asset archive'
          }
          $archive = Join-Path $downloadRoot $env:CS15_SOURCE_ARCHIVE
          $checksum = "$archive.sha256"
          $expected = ((Get-Content -LiteralPath $checksum -Raw) `
            -split '\s+')[0]
          $actual = (Get-FileHash -Algorithm SHA256 `
            -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Original asset checksum mismatch: $actual != $expected"
          }
          Expand-Archive -LiteralPath $archive `
            -DestinationPath 'build/source-assets'
          foreach ($required in @(
            'build/source-assets/cstrike/maps/de_dust2.bsp',
            'build/source-assets/cstrike/maps/fy_iceworld.bsp',
            'build/source-assets/cstrike/maps/cs_assault.bsp',
            'build/source-assets/cstrike/maps/cs_italy.bsp',
            'build/source-assets/cstrike/maps/de_inferno.bsp',
            'build/source-assets/cstrike/maps/de_nuke.bsp',
            'build/source-assets/cstrike/maps/cs_office.bsp',
            'build/source-assets/cstrike/models/v_ak47.mdl',
            'build/source-assets/cstrike/models/v_awp.mdl',
            'build/source-assets/cstrike/models/v_m249.mdl',
            'build/source-assets/cstrike/sound/weapons/ak47-1.wav',
            'build/source-assets/valve/halflife.wad'
          )) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) {
              throw "Original asset archive is incomplete: $required"
            }
          }

      - name: Cache MIPS toolchain
        uses: actions/cache@v6
        with:
          path: sdk/.toolchain
          key: bbk9588-mips-toolchain-15.2.0-windows

      - name: Install verified MIPS toolchain
        shell: pwsh
        run: .\sdk\scripts\setup_toolchain.ps1

      - name: Run host tests
        shell: pwsh
        run: .\tools\test.ps1

      - name: Preprocess original assets
        shell: pwsh
        run: |
          .\tools\build-resource-pack.ps1 `
            -Cstrike 'build/source-assets/cstrike' `
            -Valve 'build/source-assets/valve'

      - name: Verify resident world and classic texture profiles
        shell: pwsh
        run: |
          $manifest = Get-Content `
            'build/assets/CS15.manifest.json' -Raw | ConvertFrom-Json
          if ($manifest.runtime_resource_revision -ne 'M20' -or
              $manifest.world_texture_profile -ne 'classic' -or
              $manifest.world_texture_compression -or
              $manifest.player_texture_profile -ne 'classic' -or
              $manifest.player_texture_compression) {
            throw 'Release pack did not use the M20 resident/classic profile'
          }
          foreach ($map in $manifest.maps) {
            if (-not $map.visibility_resident) {
              throw "Map PVS is not resident: $($map.name)"
            }
            if ($map.maximum_visible_surfaces -gt 10240) {
              throw "Map exceeds renderer PVS capacity: $($map.name)"
            }
          }
          $iceworld = $manifest.maps |
            Where-Object name -eq 'fy_iceworld'
          if (-not $iceworld -or
              $iceworld.texture_profile.maximum_dimension -ne 64 -or
              $iceworld.texture_profile.palette_colors -ne 256 -or
              $iceworld.resident_texture_bytes -ne 15360) {
            throw 'Iceworld texture profile regressed from v0.1.3'
          }
          $players = @(
            $manifest.world_models |
              Where-Object name -match '^mdl/player_'
          )
          if ($players.Count -ne 2) {
            throw 'Expected both historical team player models'
          }
          $expectedTriangles = @{
            'mdl/player_terror' = 740
            'mdl/player_urban' = 790
          }
          foreach ($player in $players) {
            if ($player.texture_profile.maximum_dimension -ne 64 -or
                $player.texture_profile.palette_colors -ne 256 -or
                $player.textures[0].width -ne 64 -or
                $player.textures[0].height -ne 64 -or
                $player.triangles -ne $expectedTriangles[$player.name]) {
              throw "Player model quality regressed: $($player.name)"
            }
          }
          $maximumViewVertices = (
            $manifest.view_models |
              Measure-Object vertices -Maximum
          ).Maximum
          if ($maximumViewVertices -gt 1408) {
            throw "View model exceeds runtime vertex capacity: $maximumViewVertices"
          }

      - name: Build BDA
        shell: pwsh
        run: .\tools\build.ps1 -Clean

      - name: Package release files
        shell: pwsh
        run: |
          .\tools\package-release.ps1 `
            -Tag $env:GITHUB_REF_NAME `
            -RequireResourcePack

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: CS15-Lite-${{ github.ref_name }}
          path: build/release/*
          if-no-files-found: error

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $notes = @"
          Automated BBK 9588 build for $tag.

          This workflow downloads the authorized original cstrike archive
          from $($env:CS15_SOURCE_RELEASE), verifies its SHA-256, preprocesses
          maps/models/textures/animation/audio, verifies the M20 resident PVS
          and world-texture layout, the v0.1.3-style 64-pixel/256-colour world
          texture profile and 64-pixel historical player skins, rejects
          missing WAD textures, and publishes the matching CS15.C15PAK with
          the BDA and ready-to-copy 9588 install ZIP.

          Do not make the repository or these release assets public.
          "@
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Set-Content -LiteralPath $notesPath -Encoding utf8 -Value $notes
          $assets = Get-ChildItem -LiteralPath 'build/release' -File |
            ForEach-Object { $_.FullName }
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --verify-tag `
              --title "CS15 Lite $tag" --notes-file $notesPath
          }
